<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test Strapi Auth - itutrade.online</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2ecc71; border: none; color: white; cursor: pointer; }
        #result { margin-top: 20px; word-break: break-all; font-size: 12px; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h2>Đăng ký User (itutrade)</h2>
    <input type="text" id="reg_user" placeholder="Username (min 3 chars)">
    <input type="email" id="reg_email" placeholder="Email">
    <input type="password" id="reg_pass" placeholder="Password (min 6 chars)">
    <button onclick="handleRegister()">Đăng ký tài khoản</button>

    <hr>

    <h2>Đăng nhập</h2>
    <input type="text" id="login_id" placeholder="Email hoặc Username">
    <input type="password" id="login_pass" placeholder="Password">
    <button onclick="handleLogin()" style="background: #3498db;">Đăng nhập</button>

    <div id="result"></div>
</div>

<script>
    const STRAPI_URL = 'https://api.itutrade.online';

    async function handleRegister() {
        const username = document.getElementById('reg_user').value;
        const email = document.getElementById('reg_email').value;
        const password = document.getElementById('reg_pass').value;

        try {
            const response = await fetch(`${STRAPI_URL}/api/auth/local/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });
            const data = await response.json();
            document.getElementById('result').innerHTML = "<b>Kết quả Đăng ký:</b><br>" + JSON.stringify(data);
        } catch (error) {
            console.error(error);
        }
    }

    async function handleLogin() {
        const identifier = document.getElementById('login_id').value;
        const password = document.getElementById('login_pass').value;

        try {
            const response = await fetch(`${STRAPI_URL}/api/auth/local`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier, password })
            });
            const data = await response.json();
            if(data.jwt) {
                document.getElementById('result').innerHTML = `<span style="color:green">Đăng nhập thành công!</span><br><b>JWT Token:</b> ${data.jwt}`;
                // Lưu token lại để dùng cho các API sau này
                localStorage.setItem('token', data.jwt);
            } else {
                document.getElementById('result').innerHTML = `<span style="color:red">Lỗi: ${data.error.message}</span>`;
            }
        } catch (error) {
            console.error(error);
        }
    }
</script>

</body>
</html>
